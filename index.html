<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karim Zayni - Presentation</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #111;
            font-family: Arial, sans-serif;
        }

        .pdf-container {
            width: 100vw;
            height: 100vh;
        }

        object {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
        }
        .fallback {
            color: #eee;
            padding: 2rem;
            text-align: center;
        }

        .fallback a {
            color: #66b9e1;
        }
    </style>
</head>

<body>

    <div class="pdf-container">
        <object data="presentation.pdf#view=FitH" type="application/pdf">
            <p class="fallback">
                Your browser cannot display the PDF here.
                <a href="presentation.pdf">Open or download the presentation (PDF)</a>
            </p>
        </object>
    </div>

</body>
</html>
